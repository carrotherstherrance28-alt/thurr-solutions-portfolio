<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thurr Solutions — leads stop leaking between the text and the booking</title>
<meta name="description" content="Consult-first build partner for local service businesses. I map where leads slip between first contact and booked appointment, then build the smallest system that fixes it.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta property="og:title" content="Thurr Solutions">
<meta property="og:description" content="I map where leads slip between first contact and booked appointment, then build the smallest system that fixes it.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thurrsolutions.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="rail" id="rail" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap">
    <a href="#top" aria-label="Thurr Solutions home">
      <img src="assets/lockup-horizontal.svg" alt="Thurr Solutions">
    </a>
    <nav class="site-nav">
      <a class="nav-link" href="#range">What I build</a>
      <a class="btn" id="nav-cta" href="/consult.html">Book a consult</a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- 1 — HOOK. Above the fold: visible immediately, never gated on motion. -->
  <section class="hook" id="hook">
    <div class="wrap">
      <p class="kicker" id="hook-kicker"></p>
      <h1 class="display" id="hook-headline"></h1>
      <p class="lede" id="hook-sub"></p>
      <a class="btn" id="hook-cta" href="/consult.html"></a>
    </div>
  </section>

  <!-- 2 — COST -->
  <section id="cost">
    <div class="wrap">
      <h2 class="h2 r-fade"></h2>
      <div class="prose" id="cost-body"></div>
      <p class="pull r-fade"></p>
      <p class="pull-note caption r-fade"></p>
    </div>
  </section>

  <!-- 3 — THE ROUTE. Signature interaction: a lead travels the stages and stalls. -->
  <section id="map">
    <div class="wrap">
      <h2 class="h2 r-fade"></h2>
      <p class="lede r-fade" id="map-sub"></p>
      <p class="lens r-fade" id="map-lens"></p>

      <div class="route" id="route">
        <div class="route-track" aria-hidden="true">
          <div class="route-line"></div>
          <div class="route-dot" id="dot"><span class="dot-label" id="dot-label"></span></div>
        </div>
        <ol class="stages" id="stages"></ol>
      </div>
    </div>
  </section>

  <!-- 4 — PROCESS. A real sequence, so numbers earn their place. Not cards. -->
  <section id="process">
    <div class="wrap">
      <h2 class="h2 r-fade"></h2>
      <ol class="steps" id="steps"></ol>
      <p class="honest r-fade"></p>
    </div>
  </section>

  <!-- 5 — PROOF. Editorial list, not a card grid. -->
  <section id="proof">
    <div class="wrap">
      <h2 class="h2 r-fade"></h2>
      <p class="lede r-fade" id="proof-sub"></p>
      <div class="proofs" id="proofs"></div>
    </div>
  </section>


  <!-- 5b — RANGE. Definition rows, not a services card grid. -->
  <section id="range">
    <div class="wrap">
      <h2 class="h2 r-fade"></h2>
      <p class="lede r-fade" id="range-sub"></p>
      <dl class="range" id="range-list"></dl>
      <p class="range-close r-fade"></p>
    </div>
  </section>

  <!-- 6 — WHO -->
  <section id="who">
    <div class="wrap">
      <div class="who-grid">
        <div class="portrait r-fade" id="portrait"></div>
        <div id="who-body"></div>
      </div>
    </div>
  </section>

  <!-- 7 — BOOK -->
  <section class="book" id="book">
    <div class="wrap">
      <h2 class="display-sm r-fade"></h2>
      <p class="lede r-fade" id="book-body"></p>
      <a class="btn btn-lg r-fade" id="book-cta" href="#"></a>
      <p class="reassure caption r-fade"></p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <span id="f-line"></span>
    <a id="f-email" href="#"></a>
    <span id="f-note"></span>
  </div>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
